[package]
name = "cleantabs-wasm"
description = "CleanTabs' core for the Chrome extension (WebAssembly): saving tabs as notes in a CleanNotes S3 folder."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# CleanNotes' S3 folder: its note format, encryption, and tab notes. Pinned
# to a revision; to work on both at once, see the README.
cleanbucket = { git = "https://github.com/Mytherin/CleanNotes", rev = "7babdb6f74d6ff5fcec3808d68f78123b9a0f8ca" }
# Pinned: must match the wasm-bindgen CLI that builds the extension
# (extension/build.mjs).
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
base64 = "0.22"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std", "wasmbind"] }

[dev-dependencies]
cleanbucket = { git = "https://github.com/Mytherin/CleanNotes", rev = "7babdb6f74d6ff5fcec3808d68f78123b9a0f8ca", features = ["fake"] }
